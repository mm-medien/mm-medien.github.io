<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;max-width:760px;margin:0 auto;padding:32px 16px;line-height:1.6;color:#1b1b1f;background:#fafafa}h1{font-size:28px;margin:0 0 8px}h2{font-size:19px;margin-top:28px}nav a{margin-right:16px;color:#5b3df5;text-decoration:none}nav{margin-bottom:28px}small{color:#666}code{background:#eee;padding:2px 6px;border-radius:4px}</style><title>Signed in · Content Robot</title></head><body><nav><a href="/">Content Robot</a><a href="/terms.html">Terms of Service</a><a href="/privacy.html">Privacy Policy</a></nav>
<h1>TikTok sign-in</h1><p id="msg">Reading the answer from TikTok…</p>
<p><input id="code" readonly style="width:100%;font-size:15px;padding:8px"></p>
<p><button onclick="navigator.clipboard.writeText(document.getElementById('code').value);this.textContent='Copied'">Copy code</button></p>
<script>const p=new URLSearchParams(location.search);
const m=/^local(\d{4,5})-/.exec(p.get('state')||'');if(m)location.replace('http://localhost:'+m[1]+'/callback'+location.search);const c=p.get('code');const e=p.get('error_description')||p.get('error');
document.getElementById('msg').textContent=c?'Signed in. Copy this code and paste it into Content Robot on your computer:':(e?'TikTok returned an error: '+e:'No code received.');
document.getElementById('code').value=c||'';</script>
</body></html>
